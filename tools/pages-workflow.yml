name: Deploy to GitHub Pages

# Builds the game from source on every push to main and publishes dist/.
# Pages serves a project site from /Hive_incremental/, which works because
# vite.config.js sets `base: './'` — every asset path is relative.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Lint and the item validator both gate the deploy. Neither needs a
      # browser, so they cost seconds; the browser suites are not run here on
      # purpose — they want a Chromium download and several minutes, and the
      # thing this workflow protects is "does a broken build reach Pages".
      - run: npm run lint
      - run: npm run validate
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
